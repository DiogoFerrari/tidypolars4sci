
# Project information
site_name: TidyPolars(4sci) - User guide
site_url: https://www.diogoferrari.com/tidypolars4sci
repo_url: https://github.com/DiogoFerrari/tidypolars4sci
repo_name: tidypolars4sci
use_directory_urls: true

nav:
  - Overview: index.md
  - User Guide:
    - <font color="#2a9d8f">Installation</font>: usage/installation.md
    - <font color="#2a9d8f">Overview</font>: usage/usage.md
    - <font color="#2a9d8f">Read/Write Files</font>:
      - Read Files: usage/read.md
      - Write Files: usage/write.md
      - Convert from/to pandas/polars: usage/from-to-pandas-polars.md
    - <font color="#2a9d8f">Check Data Structure</font>: usage/glimpse.md
    - <font color="#2a9d8f">Data manipulation</font>:
      - Select columns: usage/data-manipulation/select.md
      - Select rows (filter): usage/data-manipulation/filter.md
      - Mutate: usage/data-manipulation/mutate.md
      - Replace values: usage/data-manipulation/replace.md
      - Fill missing: usage/data-manipulation/fill.md
      - Type conversion: usage/data-manipulation/type_conversion.md
      - Nested Data: usage/data-manipulation/nest.md
    - <font color="#2a9d8f">Statistics</font>:
      - Summarize columns: usage/statistics/summarize.md
      - Descriptive Statistics: usage/statistics/desc.md
      - Frequency Tables: usage/statistics/freq.md
      - Crosstables: usage/statistics/tab.md
    - <font color="#2a9d8f">Reporting</font>:
      - To LaTeX: usage/reporting/to-latex.md
  - Case Studies:
    - Pivot wide: case-studies/pivot-wide.md
    - Regression Tables: case-studies/regression-table.md
    - Standardizing Variables: case-studies/standardizing.md
  - Performance:
    - performance/overview.md
    - performance/filter.md
    - performance/pivot-wide.md
    - performance/summarise.md
  # - API Reference: api.md
  - API reference: reference/ ## using py to create one docstring API per page
  - Releases: releases.md

theme:
  name: material
  locale: en
  custom_dir: docs/_css
  palette:
  # Palette toggle for light mode
  - media: "(prefers-color-scheme: light)"
    scheme: white
    primary: custom
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  # Palette toggle for dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  logo: _css/tidypolars4sci-logo2.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tracking
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    # - navigation.expand # start headings expanded
    # - navigation.sections # if used, won't collapse the headings of right-side menu
    - content.code.annotate # (1)
    - navigation.prune # fold the headings on the right-side that are not the focus
    - navigation.indexes
    # - navigation.footer
    - content.tabs.link
    - content.code.copy
    - content.code.select
    # - toc.integrate  # combine right ToC into the left ToC
    - toc.follow
    - content.code.copy



# Preview controls
strict: false


extra_css:
  - _css/extra.css
  - _css/stylesheets.css

plugins:
  - search
  - autolinks 
  - charts
  - mkdocstrings:
      handlers:
        python:
          paths: ["tidypolars4sci"] # <-- for the API docstring using .py (per page docstring)
          options:
            show_source: true
            show_signature: true
            docstring_style: numpy
            docstring_options:
              warn_unknown_params: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_root_toc_entry: false
            show_object_full_path: true
  - section-index
  # starting here for one docstring per page
  - gen-files:
      scripts:
        - docs/src/gen_ref_pages.py  
  - literate-nav:
      nav_file: SUMMARY.md


markdown_extensions:
  - admonition
  - attr_list
  - extra
  - tables
  - mdx_math:
      enable_dollar_delimiter: True
  - fenced_code
  - smarty
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      default_lang: python
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: vegalite
          class: vegalite
          format: !!python/name:mkdocs_charts_plugin.fences.fence_vegalite


extra_javascript: 
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-AMS-MML_HTMLorMML
  - https://cdn.jsdelivr.net/npm/vega@5
  - https://cdn.jsdelivr.net/npm/vega-lite@5
  - https://cdn.jsdelivr.net/npm/vega-embed@6
